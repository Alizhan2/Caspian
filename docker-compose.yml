services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["guardian_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["guardian_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-guardian}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-in-production}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["guardian_objects:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend: &backend
    image: caspian-guardian-backend:local
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment: &backend-environment
      DATABASE_URL: postgresql://guardian:${POSTGRES_PASSWORD:-guardian-local-only}@db:5432/guardian
      REDIS_URL: redis://redis:6379/0
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
      EARTH_SEARCH_URL: ${EARTH_SEARCH_URL:-https://earth-search.aws.element84.com/v1}
      MODEL_PATH: /workspace/models/oil_unet.pt
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.58}
      EXPERIMENTAL_BASELINE_ENABLED: ${EXPERIMENTAL_BASELINE_ENABLED:-true}
      STORAGE_PATH: /workspace/data
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-guardian}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-in-production}
      MINIO_BUCKET: ${MINIO_BUCKET:-guardian-scenes}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    ports: []

  scheduler:
    <<: *backend
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    ports: []

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes: ["guardian_ollama:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports: ["${FRONTEND_BIND_HOST:-127.0.0.1}:5173:5173"]
    volumes:
      - ./frontend:/workspace/frontend
      - guardian_frontend_node_modules:/workspace/frontend/node_modules
    depends_on: [backend]

volumes:
  guardian_db:
  guardian_redis:
  guardian_objects:
  guardian_ollama:
  guardian_frontend_node_modules:
